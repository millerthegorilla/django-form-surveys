{% load i18n %}
<!-- Navbar goes here -->
<nav class="bg-white shadow-lg">
<div class="max-w-6xl mx-auto px-4">
<div class="flex justify-between">
<div class="flex space-x-7">
<div>
<!-- Website Logo -->
<a %}"="" class="flex items-center py-4 px-2" djf_surveys:index"="" href="{% url ">
<span class="font-semibold text-gray-500 text-lg">{% trans "Home" %}</span>
</a>
</div>
<!-- Primary Navbar items -->
<div class="hidden md:flex items-center space-x-1">
                    {% include 'djf_surveys/components/primary_nav_items.html' %}
                </div>
</div>
<!-- Secondary Navbar items -->
<div class="hidden md:flex items-center space-x-3">
<a class="py-2 px-2 font-medium text-gray-500 rounded hover:bg-blue-500 hover:text-white" href="{% url 'djf_surveys:index' %}">
<svg class="h-6 w-6 stroke-gray-500 hover:stroke-white" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">#}
                        <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</a>
</div>
<!-- Mobile menu button -->
<div class="md:hidden flex items-center">
<button class="outline-none mobile-menu-button">
<svg class="w-6 h-6 text-gray-500 hover:text-blue-500" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" x-show="!showMenu">
<path d="M4 6h16M4 12h16M4 18h16"></path>
</svg>
</button>
</div>
</div>
</div>
<!-- mobile menu -->
<div class="hidden mobile-menu">
<ul class="">
<li class="active">
<a class="block text-sm px-2 py-4 px-5 text-gray-500 hover:text-white hover:bg-blue-500 font-semibold" href="{% url 'djf_surveys:admin_survey_list' %}">{% trans "Surveys" %}</a>
</li>
<li>
<a class="block text-sm px-2 py-4 px-5 text-gray-500 hover:text-white hover:bg-blue-500 font-semibold" href="{% url 'djf_surveys:admin_survey_selection_list' %}">{% trans "Survey Selections" %}</a>
</li>
<li>
<a class="block text-sm px-2 py-4 px-5 text-gray-500 hover:text-white hover:bg-blue-500 font-semibold" href="https://github.com/millerthegorilla/django-form-surveys" target="_blank">{% trans "About" %}</a>
</li>
</ul>
</div>
<script>
        const btn = document.querySelector("button.mobile-menu-button");
        const menu = document.querySelector(".mobile-menu");

        btn.addEventListener("click", () => {
            menu.classList.toggle("hidden");
        });
    </script>
