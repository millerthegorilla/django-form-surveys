{% load i18n %}
  <!--Verically centered modal-->
<div aria-labelledby="addQuestionTitle" aria-modal="true" class="tw:fixed tw:left-0 tw:top-0 tw:z-1055 tw:hidden tw:h-full tw:w-full tw:overflow-y-auto tw:overflow-x-hidden tw:outline-none" data-te-modal-init="" id="addQuestion" role="dialog" tabindex="-1">
<div class="tw:pointer-events-none tw:relative tw:flex tw:min-h-[calc(100%-1rem)] tw:w-auto tw:translate-y-[-50px] tw:items-center tw:opacity-0 tw:transition-all tw:duration-300 tw:ease-in-out tw:min-[576px]:mx-auto tw:min-[576px]:mt-7 tw:min-[576px]:min-h-[calc(100%-3.5rem)] tw:min-[576px]:max-w-[500px]" data-te-modal-dialog-ref="">
<div class="tw:pointer-events-auto tw:relative tw:flex tw:w-full tw:flex-col tw:rounded-md tw:border-none tw:bg-white tw:bg-clip-padding tw:text-current tw:shadow-lg tw:outline-none tw:dark:bg-neutral-600">
<div class="tw:flex tw:shrink-0 tw:items-center tw:justify-between tw:rounded-t-md tw:border-b-2 tw:border-neutral-100 border-opacity-100 tw:p-4 dark:border-opacity-50">
<!--Modal title-->
<h5 class="tw:text-xl tw:font-medium tw:leading-normal tw:text-neutral-800 tw:dark:text-neutral-200" id="exampleModalScrollableLabel">
            {% trans "Type Field" %}
          </h5>
<!--Close button-->
<button aria-label="Close" class="tw:box-content tw:rounded-none tw:border-none tw:hover:no-underline tw:hover:opacity-75 tw:focus:opacity-100 tw:focus:shadow-none tw:focus:outline-none" data-te-modal-dismiss="" type="button">
<svg class="tw:h-6 tw:w-6" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!--Modal body-->
<div class="tw:relative tw:p-4">
<section>
<ul class="tw:bg-slate-50 tw:p-4 tw:sm:px-8 tw:sm:pt-6 tw:sm:pb-8 tw:lg:p-4 tw:xl:px-8 tw:xl:pt-6 tw:xl:pb-8 tw:grid tw:grid-cols-1 tw:sm:grid-cols-2 tw:lg:grid-cols-1 tw:xl:grid-cols-2 tw:gap-4 tw:text-sm tw:leading-6">
                    {% for type_field in get_type_field %}
                    <li class="tw:flex">
<a class="tw:hover:border-blue-500 tw:hover:border-solid tw:hover:bg-white tw:hover:text-blue-500 group tw:w-full tw:flex tw:flex-col tw:items-center tw:justify-center tw:rounded-md tw:border-2 tw:border-slate-300 tw:text-sm tw:leading-6 tw:text-slate-900 tw:font-medium tw:py-3" href="{% url 'djf_surveys:admin_create_question' object.id type_field.id %}">
<i class="{{ type_field.icon }}"></i>
                            {{ type_field.label }}
                        </a>
</li>
                    {% endfor %}
                </ul>
</section>
</div>
<!--Modal footer-->
<div class="tw:flex tw:shrink-0 tw:flex-wrap tw:items-center tw:justify-end tw:rounded-b-md tw:border-t-2 tw:border-neutral-100 border-opacity-100 tw:p-4 dark:border-opacity-50">
<button class="tw:inline-block tw:rounded bg-primary-100 tw:px-6 tw:pb-2 tw:pt-2.5 tw:text-xs tw:font-medium tw:uppercase tw:leading-normal text-primary-700 tw:transition tw:duration-150 tw:ease-in-out hover:bg-primary-accent-100 focus:bg-primary-accent-100 tw:focus:outline-none tw:focus:ring-0 active:bg-primary-accent-200" data-te-modal-dismiss="" data-te-ripple-color="light" data-te-ripple-init="" type="button">
            {% trans "Close" %}
          </button>
</div>
</div>
</div>
</div>
