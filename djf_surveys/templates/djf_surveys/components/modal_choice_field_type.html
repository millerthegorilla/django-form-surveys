{% block extra_css %}

{% endblock %}
<!-- Modal -->
<div aria-hidden="true" aria-labelledby="exampleModalComponentsLabel" class="static left-0 top-0 z-[1055] block h-full w-full overflow-y-auto overflow-x-hidden outline-none" data-twe-backdrop="false" data-twe-modal-init="" id="addQuestion" tabindex="-1">
 <div class="pointer-events-none relative w-auto opacity-100 transition-all duration-300 ease-in-out min-[576px]:mx-auto min-[576px]:my-7 min-[576px]:max-w-[500px]" data-twe-modal-dialog-ref="">
  <div class="pointer-events-auto relative flex w-full flex-col rounded-md border-none bg-white bg-clip-padding text-current shadow-4 outline-none dark:bg-surface-dark">
   <div class="flex flex-shrink-0 items-center justify-between rounded-t-md border-b-2 border-neutral-100 p-4 dark:border-white/10">
    <h5 class="text-xl font-medium leading-normal text-surface dark:text-white" id="exampleModalComponentsLabel">
     Modal title
    </h5>
    <button aria-label="Close" class="box-content rounded-none border-none text-neutral-500 hover:text-neutral-800 hover:no-underline focus:text-neutral-800 focus:opacity-100 focus:shadow-none focus:outline-none dark:text-neutral-400 dark:hover:text-neutral-300 dark:focus:text-neutral-300" data-twe-modal-dismiss="" type="button">
     <span class="[&amp;&gt;svg]:h-6 [&amp;&gt;svg]:w-6">
      <svg fill="currentColor" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
       <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round">
       </path>
      </svg>
     </span>
    </button>
   </div>
   <div class="relative flex-auto p-4" data-twe-modal-body-ref="">
    <section>
     <ul class="bg-slate-50 p-4 sm:px-8 sm:pt-6 sm:pb-8 lg:p-4 xl:px-8 xl:pt-6 xl:pb-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 xl:grid-cols-2 gap-4 text-sm leading-6">
      {% for type_field in get_type_field %}
      <li class="flex">
       <a class="hover:border-blue-500 hover:border-solid hover:bg-white hover:text-blue-500 group w-full flex flex-col items-center justify-center rounded-md border-2 border-slate-300 text-sm leading-6 text-slate-900 font-medium py-3" href="{% url 'djf_surveys:admin_create_question' object.id type_field.id %}">
        <i class="{{ type_field.icon }}">
        </i>
        {{ type_field.label }}
       </a>
      </li>
      {% endfor %}
     </ul>
    </section>
   </div>
   <div class="flex flex-shrink-0 flex-wrap items-center justify-end rounded-b-md border-t-2 border-neutral-100 p-4 dark:border-white/10">
    <button class="inline-block rounded bg-primary-100 px-6 pb-2 pt-2.5 text-xs font-medium uppercase leading-normal text-primary-700 transition duration-150 ease-in-out hover:bg-primary-accent-200 focus:bg-primary-accent-200 focus:outline-none focus:ring-0 active:bg-primary-accent-200 dark:bg-primary-300 dark:hover:bg-primary-400 dark:focus:bg-primary-400 dark:active:bg-primary-400" data-twe-modal-dismiss="" data-twe-ripple-color="light" data-twe-ripple-init="" type="button">
     Close
    </button>
   </div>
  </div>
 </div>
</div>
{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/tw-elements/js/tw-elements.umd.min.js">
</script>
{% endblock extra_js %}
