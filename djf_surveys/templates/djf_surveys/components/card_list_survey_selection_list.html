<div>
    <div class="flex -space-x-4 hover:space-x-1 float-right">
        <a href="{% url 'djf_surveys:survey_selection' survey_selection.slug %}" class="z-20 block p-4 text-purple-700 transition-all bg-purple-100 border-2 border-white rounded-full active:bg-purple-50 hover:scale-110 focus:outline-none focus:ring"
                type="button">
                {% include "djf_surveys/buttons/add_button.svg" %}
        </a>

        {% if user.is_superuser %}
            <a href="{% url 'djf_surveys:admin_forms_survey_selection' survey_selection.slug %}" class="z-20 block p-4 text-blue-700 transition-all bg-blue-100 border-2 border-white rounded-full active:bg-blue-50 hover:scale-110 focus:outline-none focus:ring"
                    type="button">
                {% include "djf_surveys/buttons/edit_button.svg" %}
            </a>

            <a href="{% url 'djf_surveys:admin_summary_survey_selection' survey_selection.slug %}" class="z-30 block p-4 text-green-700 transition-all bg-green-100 border-2 border-white rounded-full hover:scale-110 focus:outline-none focus:ring active:bg-gren50"
                    type="button">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" />
                </svg>
            </a>

            <button class="button-delete z-30 block p-4 text-red-700 transition-all bg-red-100 border-2 border-white rounded-full hover:scale-110 focus:outline-none focus:ring active:bg-red-50"
                    data-te-toggle="modal"
                    data-te-target="#modalDelete"
                    data-mdb-object_name="{{ survey_selection.name }}"
                    data-mdb-object_delete_url="{% url 'djf_surveys:admin_delete_survey_selection' survey_selection.slug %}">
                {% include "djf_surveys/buttons/delete_button.svg" %}
            </button>
        {% endif %}
            <a href="#" class="button-share z-30 block p-4 text-amber-700 transition-all bg-amber-100 border-2 border-white rounded-full active:bg-amber-50 hover:scale-110 focus:outline-none focus:ring" type="button" data-share-link="{% url 'djf_surveys:selection_share_link' survey_selection.slug %}">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z"></path>
                </svg>
            </a>
    </div>
    
    <a class="relative block p-8 overflow-hidden border border-gray-100 rounded-lg bg-white" href="{% if user.is_authenticated or survey_selection.can_anonymous_user %}{% url 'djf_surveys:survey_selection' survey_selection.slug %}{% endif %}">
        <span class="absolute inset-x-0 bottom-0 h-2  bg-gradient-to-r from-green-300 via-blue-500 to-purple-600"></span>
        <div class="justify-between sm:flex">
            <div>
                <h5 class="text-xl font-bold text-gray-900">
                    {{ survey_selection.name }}
                </h5>
            </div>
        </div>

        <div class="no-tailwindcss-base mt-4 sm:pr-8">
            {{ survey_selection.description|safe|truncatechars:30 }}
        </div>
    </a>
</div>
