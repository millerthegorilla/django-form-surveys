{% load i18n static %}
<div class="tw:flex tw:space-x-4 tw:mb-5">
  <form class="">
    <div class="tw:relative">
      <input class="tw:h-10 tw:pr-10 tw:text-sm tw:placeholder-gray-300 tw:border tw:border-gray-200 tw:rounded-lg tw:focus:z-10"
             name="q"
             placeholder="{% trans 'Search...' %}"
             type="text"
             value="{{ search_query }}" />
      <button class="tw:absolute tw:inset-y-0 tw:right-0 tw:p-2 tw:mr-px tw:text-gray-600 tw:rounded-r-lg"
              type="submit">
              {% include "djf_surveys/buttons/search_button.html" with size=5 %}
      </button>
      <button class="tw:absolute tw:inset-y-0 tw:right-5 tw:p-2 tw:mr-px tw:text-gray-600 tw:rounded-r-lg"
              id="cancel_button"
              type="cancel">{% include "djf_surveys/buttons/cancel_search_button.html" with size=5 %}</button>
    </div>
  </form>
</div>
<div id="index-link" data-link="{% url 'djf_surveys:index' %}" hidden></div>
{% block extra_js %}
  <script src="{% static 'djf_surveys/js/cancel_button.js' %}"type="text/javascript"></script>
{% endblock extra_js %}
