{% load static djf_survey_tags %}
<input id="{{ widget.attrs.id }}-parent"  
       type="{{ widget.type }}"
       name="{{ widget.name }}"
       class="rating-parent"
       {% if widget.value != None %} value="{{ widget.value }}" {% else %} value="0" {% endif %}
       {% include "django/forms/widgets/attrs.html" %}>
{% if widget.value != None %}
    {% create_star widget.value widget.attrs.id widget.num_ratings %}
{% else %}
    {% create_star "0" widget.attrs.id widget.num_ratings %}
{% endif %}
<div id="id-{{ widget.name }}-hidden" class="rating {{ widget.name }}" data-id="{{ widget.attrs.id }}" data-required="{{ widget.required }}" hidden></div>
