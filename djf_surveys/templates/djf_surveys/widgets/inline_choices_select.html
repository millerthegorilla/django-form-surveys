<button class="py-2 px-2 text-white rounded-lg bg-blue-500 hover:bg-blue-600" id="djf-btn-add-field" type="button">
<svg class="h-6 w-6 float-left" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 6v6m0 0v6m0-6h6m-6 0H6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<span class="ml-3 font-medium">{{ widget.choice_label }}</span>
<script>
    let djfRemoveFieldButtons = [...document.getElementsByClassName("djf-btn-remove-field")];
    let djfFieldChoice = [...document.getElementsByClassName("djf-field-choice")];
    let wrapper = [...document.getElementsByClassName("djf-wrapper-choice-field")];
    let superWrapper = document.getElementById("super-wrapper");
    const djfBtnAddField = document.getElementById("djf-btn-add-field");
    const widgetName = "{{ widget.name }}";
    let hiddenField = document.getElementsByName("{{ widget.name }}")[0];
    
    window.onload = function() {
       updateValues();
       updateWidgetValue();
    };
    
    function updateValues() {
        let locals = [];
        for (e of wrapper) {
            const value = e.children[0].children[0].value;
            locals.push(value);
        }
        hiddenField.value = locals;    
    };

    function updateWidgetValue() {
        let localvalues = [];
        for (e of wrapper) {
            const value = e.children[0].children[0].value;
            localvalues.push(value);
        }      
        let widgetValue = localvalues.filter(function (el) {
            return el != "";
        });
        // loop through selects and remove select.value from each other select
        for (let i = 0; i < djfFieldChoice.length; i++) {
            const selectElement = djfFieldChoice[i].children[0];
            const selectValue = selectElement.value;
            const options = selectElement.options;
            for (let j = 0; j < options.length; j++) {
                if (widgetValue.includes(options[j].value) && options[j].value != selectValue && options[j].value != "") {
                    options[j].disabled = true;
                } else {
                    options[j].disabled = false;
                }
            }
        }
        updateValues();
    }

    function removeField(removeFieldButtons) {
        removeFieldButtons.map((removeBtn) => {
            removeBtn.onclick = () => {
                console.log("superWrapper.children.length", superWrapper.children.length);
                if (superWrapper.children.length > 2) {
                    removeBtn.parentElement.parentElement.parentElement.remove();
                    wrapper = [...document.getElementsByClassName("djf-wrapper-choice-field")];
                    updateWidgetValue();
                } else {
                    alert("{% trans 'at least two choices' %}");
                }
            };
        });
        updateValues();
    }
    removeField(djfRemoveFieldButtons);

    djfBtnAddField.onclick = () => {
        const node = superWrapper.children[superWrapper.children.length -1].cloneNode(true);
        node.children[0].children[0].selectedIndex = 0;
        superWrapper.appendChild(node);
        node.children[0].children[0].setAttribute("name", "{{ widget.name }}_" + (superWrapper.children.length));
        djfRemoveFieldButtons = [...document.getElementsByClassName("djf-btn-remove-field")];
        removeField(djfRemoveFieldButtons);
        wrapper = [...document.getElementsByClassName("djf-wrapper-choice-field")];
        updateValues();
    }

</script>
