{% load i18n %}

<!-- hidden field -->
<input !="None" "django="" %}="" %}{%="" attrs.html"="" endif="" forms="" if="" include="" name="{{ widget.name }}" type="{{ widget.type }}" value="{{ widget.value }}" widget.value="" widgets="" {%=""/>
<!-- loop field value -->
<div id="djf-wrapper-choice-field">
{% for value in widget.choice_value %}
    <div class="tw:relative tw:mb-2 djf-field-choice">
<input "djf_surveys="" %}="" attrs_exclude_id.html"="" class="djf-input-field tw:w-6 tw:h-6 tw:border tw:border-gray-200 tw:rounded-md tw:mb-4" include="" name="{{ widget.name }}_{{ forloop.counter }}" oninput="updateWidgetValue()" type="text" value="{{ value }}" widgets="" {%=""/>
<div class="tw:absolute tw:top-2 tw:right-2">
<button class="djf-btn-remove-field tw:py-2 tw:px-2 tw:text-white tw:rounded-lg tw:bg-red-500 tw:hover:bg-red-600" type="button">
<svg class="tw:h-6 tw:w-6 tw:stroke-white tw:hover:stroke-white" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">#}
                    <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
{% endfor %}

<!-- loop field extra -->
{% for extra in widget.extra %}
    <div class="tw:relative tw:mb-2 djf-field-choice">
<input "djf_surveys="" %}="" attrs_exclude_id.html"="" class="djf-input-field tw:w-6 tw:h-6 tw:border tw:border-gray-200 tw:rounded-md tw:mb-4" include="" name="{{ widget.name }}_{{ extra }}" oninput="updateWidgetValue()" type="text" widgets="" {%=""/>
<div class="tw:absolute tw:top-2 tw:right-2">
<button class="djf-btn-remove-field tw:py-2 tw:px-2 tw:text-white tw:rounded-lg tw:bg-red-500 tw:hover:bg-red-600" type="button">
<svg class="tw:h-6 tw:w-6 tw:stroke-white tw:hover:stroke-white" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">#}
                    <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
{% endfor %}
</div>
<button class="tw:py-2 tw:px-2 tw:text-white tw:rounded-lg tw:bg-blue-500 tw:hover:bg-blue-600" id="djf-btn-add-field" type="button">
<svg class="tw:h-6 tw:w-6 tw:float-left" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 6v6m0 0v6m0-6h6m-6 0H6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<span class="tw:ml-3 tw:font-medium">{{ widget.choice_label }}</span>
<script>
    let djfRemoveFieldButtons = [...document.getElementsByClassName("djf-btn-remove-field")];
    let djfFieldChoice = [...document.getElementsByClassName("djf-field-choice")];
    const djfBtnAddField = document.getElementById("djf-btn-add-field");
    const wrapper = document.getElementById("djf-wrapper-choice-field");
    const widgetName = "{{ widget.name }}";

    function updateWidgetValue() {
        // This function is used to update all fields then store the value in the hidden field
        let values = [];
        for (e of djfFieldChoice) {
            const value = e.children[0].value;
            values.push(value);
        }
        
        let widgetValue = values.filter(function (el) {
            return el != "";
        });
        console.log(widgetValue);
        document.getElementById("id_" + widgetName).value = widgetValue.toString();
    }

    function removeField(removeFieldButtons) {
        // This function is used to remove field
        removeFieldButtons.map((removeBtn) => {
            removeBtn.onclick = () => {
                if (djfFieldChoice.length > 2) {
                    console.log(removeBtn.parentElement.parentElement);
                    removeBtn.parentElement.parentElement.remove();

                    // update element count
                    djfFieldChoice = [...document.getElementsByClassName("djf-field-choice")];
                    updateWidgetValue();
                } else {
                    alert("{% trans 'at least two choices' %}");
                }
            };
        });
    }
    removeField(djfRemoveFieldButtons);

    djfBtnAddField.onclick = () => {
        // This event is used to add field
        const lastField = djfFieldChoice.slice(-1);
        const fieldName = lastField[0].children[0].getAttribute("name");
        const lastNumber = parseInt(fieldName.split("_")[1]);
        const newLastNumer = lastNumber + 1;
        const node = lastField[0].cloneNode(true);
        node.children[0].setAttribute("name", "{{ widget.name }}_" + newLastNumer);
        node.children[0].value = "";
        document.getElementById("djf-wrapper-choice-field").appendChild(node);

        // update element
        djfRemoveFieldButtons = [...document.getElementsByClassName("djf-btn-remove-field")];
        removeField(djfRemoveFieldButtons);

        // update element count
        djfFieldChoice = [...document.getElementsByClassName("djf-field-choice")];
    }

</script>
